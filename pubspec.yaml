name: face_attendance_app
description: "A new Flutter project."
publish_to: 'none'

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mssql_connection: ^3.0.0
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.13.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  crypto: ^3.0.3
  image: ^4.1.7
  http: ^1.2.0
  intl: ^0.18.1
  table_calendar: ^3.0.9
  geolocator: any
  flutter_background_service: any
  flutter_local_notifications: ^17.0.0
