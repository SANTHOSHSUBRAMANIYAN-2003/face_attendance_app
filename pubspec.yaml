  url_launcher: ^6.2.1
  flutter_map: any
  latlong2: any
  wakelock_plus: ^1.5.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  dart_jsonwebtoken: ^2.14.0
  sqflite: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
